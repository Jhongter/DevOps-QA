# Perfil "postgres" - usado quando a aplicacao roda via docker-compose
spring.datasource.url=jdbc:postgresql://postgres:5432/gamificacao
spring.datasource.username=gamificacao
spring.datasource.password=gamificacao
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
