services:
  postgres:
    image: postgres:16
    container_name: gamificacao-postgres
    environment:
      POSTGRES_DB: gamificacao
      POSTGRES_USER: gamificacao
      POSTGRES_PASSWORD: gamificacao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: gamificacao-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build: .
    container_name: gamificacao-backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      # Dentro do container, "localhost" seria o proprio backend.
      # O banco precisa ser acessado pelo nome do servico: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gamificacao
      SPRING_DATASOURCE_USERNAME: gamificacao
      SPRING_DATASOURCE_PASSWORD: gamificacao
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      - postgres

volumes:
  postgres_data:
